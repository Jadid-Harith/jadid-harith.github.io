<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy caption | Ember Station</title><meta name="robots" content="noindex">
<style>
:root{--bg:#14161b;--panel:#1c1f26;--ink:#ece6d8;--muted:#a59f92;--amber:#ffb23e;--line:#2c3039}
@media (prefers-color-scheme: light){:root{--bg:#f6f2ea;--panel:#fffaf1;--ink:#24211c;--muted:#6b645a;--amber:#b86a00;--line:#e4dccd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;padding:28px 0 48px}
.brand{font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-size:13px}
h1{font-size:22px;line-height:1.25;margin:8px 0 16px;text-wrap:balance}
#cap{width:100%;min-height:220px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;resize:vertical}
button{display:block;width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:18px;padding:16px;border-radius:10px;border:0;background:var(--amber);color:#1a1205;cursor:pointer}
.ok{color:var(--muted);text-align:center;margin-top:10px;min-height:1.5em}
</style></head><body><div class="wrap">
<div class="brand">Ember Station</div>
<h1 id="title">Caption</h1>
<textarea id="cap" aria-label="Caption" readonly></textarea>
<button id="copy" type="button">Copy caption</button>
<p class="ok" id="ok" role="status"></p>
</div>
<script>
const p = new URLSearchParams(location.hash.slice(1));
const cap = p.get("c") || "", t = p.get("t") || "";
document.getElementById("cap").value = cap || "No caption in this link.";
if (t) document.getElementById("title").textContent = t;
const ok = document.getElementById("ok");
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(cap); ok.textContent = "Copied. Now open TikTok and paste it."; }
  catch { const a = document.getElementById("cap"); a.removeAttribute("readonly"); a.select(); document.execCommand("copy"); a.setAttribute("readonly", ""); ok.textContent = "Copied (if not, the text is selected: tap Copy)."; }
};
</script>
</body></html>
